[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leadengine"
version = "0.1.0"
description = "Internal zero-cost B2B lead discovery and qualification engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "dnspython>=2.6.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer[all]>=0.12.3",
    "rich>=13.7.1",
    "tenacity>=8.3.0",
    "rapidfuzz>=3.8.1",
    "tldextract>=5.1.2",
    "python-dateutil>=2.9.0",
    "PyYAML>=6.0.1",
    "playwright>=1.43.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "aiofiles>=23.2.1",
]

[project.scripts]
leadengine = "app.cli.commands:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]
