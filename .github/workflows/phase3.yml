name: LeadEngine checks
on: [push, pull_request]
jobs:
  production-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/production-integration-20261117'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package from verified production ancestry and run the original source guard
        run: |
          set -eu
          git fetch origin main:refs/heads/main codex/intent-radar-phase4-20261113:refs/heads/codex/intent-radar-phase4-20261113
          live=$(curl --fail --silent --show-error https://app.planebyte.com/release.json | python -c 'import sys,json,re; s=json.load(sys.stdin)["source_commit"]; assert re.fullmatch("[0-9a-f]{40}",s); print(s)')
          python scripts/check_release_candidate.py --deployed-source "$live" --destination data/artifacts/staging/candidate
  verify:
    strategy:
      fail-fast: false
      matrix:
        shared_accounts: ['false', 'true']
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: leadengine
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      SHARED_BILLING_ACCOUNTS_ENABLED: ${{ matrix.shared_accounts }}
      DATABASE_URL: postgresql://postgres:test-only@localhost:5432/leadengine
      RUN_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - name: Provide PostgreSQL 18 clients for restore acceptance
        run: |
          set -eu
          bin=/usr/lib/postgresql/18/bin
          if ! test -x "$bin/pg_dump" || ! test -x "$bin/psql"; then
            sudo apt-get update
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y postgresql-client-18
          fi
          "$bin/pg_dump" --version
          "$bin/psql" --version
          echo "HEYSOW_PG_TEST_BIN=$bin" >> "$GITHUB_ENV"
      - run: .venv/bin/python -m pytest -q
      - run: npm ci
        working-directory: dashboard
      - run: npm run typecheck && npm run lint && npm test
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - name: Build and test all six browser suites on this checkout
        run: bash scripts/verify_browser_matrix.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics-sharing-${{ matrix.shared_accounts }}
          retention-days: 3
          path: data/artifacts/verification/ci-browser/${{ github.sha }}
