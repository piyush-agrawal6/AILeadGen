app:
  env: development
  user_agent: "LeadEngine/1.0 (+https://planebyte.com)"
  contact_email: "leadengine@planebyte.com"

database:
  path: "data/lead_engine.db"

crawler:
  max_pages_per_site: 8
  max_depth: 2
  page_timeout_seconds: 12
  max_site_duration_seconds: 45
  max_response_bytes: 3000000
  concurrency: 4
  per_domain_concurrency: 1

http:
  timeout_seconds: 10
  retries: 2
  concurrency: 15

discovery:
  raw_multiplier: 10
  overpass_url: "https://overpass-api.de/api/interpreter"
  nominatim_url: "https://nominatim.openstreetmap.org"
  overture_release: "" # Auto-discover latest release dynamically

audit:
  lighthouse_enabled: true
  lighthouse_timeout_seconds: 90
  lighthouse_concurrency: 1
  preliminary_score_threshold: 30 # Run lighthouse if preliminary opportunity >= threshold

export:
  include_rejected: true
