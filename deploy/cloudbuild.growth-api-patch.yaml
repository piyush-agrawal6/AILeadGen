steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, Dockerfile, --build-arg, 'SOURCE_REV=${_SOURCE_REV}', -t, '${_IMAGE}', .]
  - name: gcr.io/cloud-builders/docker
    args: [run, --rm, --entrypoint, python, '${_IMAGE}', -m, pip, check]
images: ['${_IMAGE}']
timeout: 600s
logsBucket: gs://querryside-leadengine-build-logs
options:
  logging: GCS_ONLY
