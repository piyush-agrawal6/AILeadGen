steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    args: [build, -f, deploy/Dockerfile.growth-api, --build-arg, 'SOURCE_REV=${_SOURCE_REV}', -t, '${_API_IMAGE}', .]
  - id: worker
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: [build, -f, deploy/Dockerfile.growth-worker, --build-arg, 'SOURCE_REV=${_SOURCE_REV}', -t, '${_WORKER_IMAGE}', .]
  - id: api-lock-check
    name: gcr.io/cloud-builders/docker
    waitFor: [api]
    args: [run, --rm, --entrypoint, python, '${_API_IMAGE}', -m, pip, check]
  - id: worker-lock-check
    name: gcr.io/cloud-builders/docker
    waitFor: [worker]
    args: [run, --rm, --entrypoint, python, '${_WORKER_IMAGE}', -m, pip, check]
images: ['${_API_IMAGE}', '${_WORKER_IMAGE}']
timeout: 1200s
logsBucket: gs://querryside-leadengine-build-logs
options:
  logging: GCS_ONLY
